name: Release rehearsals

# Slow end-to-end rehearsals (about 1-15 minutes each), kept out of the
# normal CI run. They run when the rehearsal code itself changes, and on
# demand (Actions > Release rehearsals > Run workflow), which should be
# done before tagging a release. See docs/REHEARSALS.md.
on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - 'rehearsals/**'
      - '.github/workflows/rehearsals.yml'

permissions:
  contents: read

jobs:
  rehearsal:
    name: Rehearsal (${{ matrix.rehearsal }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        rehearsal: [backup, production, reliability, mutation]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      # Each rehearsal starts its own redis-server on a random loopback
      # port with a random password, so the system service is not needed
      - name: Install redis-server
        if: matrix.rehearsal != 'backup'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
          sudo systemctl disable --now redis-server || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      # Only the mutation rehearsal runs browser tests
      - name: Install Playwright and headless Chromium
        if: matrix.rehearsal == 'mutation'
        run: |
          python -m pip install -r e2e/requirements.txt
          python -m playwright install --with-deps --only-shell chromium

      - name: Run the rehearsal
        run: |
          python -m rehearsals ${{ matrix.rehearsal }} \
            ${{ matrix.rehearsal == 'mutation' && '--browser' || '' }}
