
name: Python Helpdesk CI

# Run tests when changes are pushed or reviewed
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Restrict the workflow's repository permissions
permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    # CI-only key, not used for production
    env:
      SECRET_KEY: ci-testing-key-not-for-production

    steps:
      # Step 1: Download repository code
      - name: Checkout repository
        uses: actions/checkout@v7

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Step 4: Check dependencies for known security vulnerabilities
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --strict -r requirements.txt

      # Step 5: Check Python syntax
      - name: Check Python syntax
        run: |
          python -m compileall -q app.py csv_export.py database.py migrations.py security_config.py setup_accounts.py sla.py sla_storage.py

      # Step 6: Run automated tests
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v
