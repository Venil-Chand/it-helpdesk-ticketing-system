
name: Python Helpdesk CI

# Run tests when changes are pushed or reviewed
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Restrict the workflow's repository permissions
permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    # CI-only key, not used for production
    env:
      SECRET_KEY: ci-testing-key-not-for-production
      # A throwaway Redis for the shared rate-limit tests (emptied by them)
      HELPDESK_TEST_REDIS_URL: redis://127.0.0.1:6379/15

    # Disposable Redis, reachable only from this job's runner
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      # Step 1: Download repository code
      - name: Checkout repository
        uses: actions/checkout@v7

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Step 4: Check dependencies for known security vulnerabilities
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --strict -r requirements.txt

      # Step 5: Check Python syntax
      - name: Check Python syntax
        run: |
          python -m compileall -q accounts.py app.py audit_archive.py csv_export.py database.py migrations.py proxy_trust.py secret_files.py security_config.py setup_accounts.py sla.py sla_storage.py validation.py wsgi.py helpdesk notifications scripts deploy

      # Step 6: Run automated tests
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v
