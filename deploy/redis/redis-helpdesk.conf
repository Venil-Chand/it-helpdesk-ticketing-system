# Redis settings for the helpdesk's shared rate-limit counters.
#
# Merge these into the Redis configuration on the helpdesk server (for
# Ubuntu's redis-server package: /etc/redis/redis.conf), then:
#     sudo systemctl restart redis-server
#
# Redis holds only short-lived counters ("this address tried to sign in 3
# times this minute"), each expiring after a minute. It stores no
# passwords, tickets or sessions, so it needs no backup and no disk.
#
# The most important rule: Redis must never be reachable from the
# internet. These settings remove the network listener completely.

# No TCP listener at all; clients use the Unix socket below
port 0
bind 127.0.0.1 -::1
protected-mode yes

# The socket is usable by the redis user and the redis group only. Add the
# helpdesk service account to the group:  sudo usermod -aG redis helpdesk
unixsocket /run/redis/redis-server.sock
unixsocketperm 770

# Accounts are defined in an ACL file: users.acl next to this file,
# installed as /etc/redis/users.acl (owner redis:redis, mode 0600) with
# CHANGE-ME replaced by a long random password, the same password as in
# the helpdesk's credential file
#     redis+unix://helpdesk:<password>@/run/redis/redis-server.sock
# (docs/STAGING_RUNBOOK.md, phase 7, does both without the password ever
# appearing on a command line). Redis refuses an ACL file containing
# anything but "user" lines, so the explanation lives here:
#
#   * the default account is disabled, so a client that does not sign in
#     can do nothing;
#   * the helpdesk account may run only the commands the rate limiter
#     uses, only on its own keys (LIMITS:LIMITER/helpdesk/*). Checked with
#     Redis 7.0: sign-in limiting and the readiness check work, while GET
#     of other keys, SET, KEYS, FLUSHALL and CONFIG are refused. On Redis
#     7.2 or newer, also allow +client|setinfo;
#   * for administration, connect as root with a separate, temporarily
#     created account rather than giving the helpdesk more.
aclfile /etc/redis/users.acl

# Counters are disposable: nothing is written to disk
save ""
appendonly no

# Bounded memory. Every rate-limit key has an expiry, so evicting the
# keys closest to expiring is safe under pressure.
maxmemory 64mb
maxmemory-policy volatile-ttl

# Close idle client connections after 5 minutes
timeout 300
