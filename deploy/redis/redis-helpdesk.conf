# Redis settings for the helpdesk's shared rate-limit counters.
#
# Merge these into the Redis configuration on the helpdesk server (for
# Ubuntu's redis-server package: /etc/redis/redis.conf), then:
#     sudo systemctl restart redis-server
#
# Redis holds only short-lived counters ("this address tried to sign in 3
# times this minute"), each expiring after a minute. It stores no
# passwords, tickets or sessions, so it needs no backup and no disk.
#
# The most important rule: Redis must never be reachable from the
# internet. These settings remove the network listener completely.

# No TCP listener at all; clients use the Unix socket below
port 0
bind 127.0.0.1 -::1
protected-mode yes

# The socket is usable by the redis user and the redis group only. Add the
# helpdesk service account to the group:  sudo usermod -aG redis helpdesk
unixsocket /run/redis/redis-server.sock
unixsocketperm 770

# Accounts are defined in an ACL file (see users.acl next to this file)
aclfile /etc/redis/users.acl

# Counters are disposable: nothing is written to disk
save ""
appendonly no

# Bounded memory. Every rate-limit key has an expiry, so evicting the
# keys closest to expiring is safe under pressure.
maxmemory 64mb
maxmemory-policy volatile-ttl

# Close idle client connections after 5 minutes
timeout 300
