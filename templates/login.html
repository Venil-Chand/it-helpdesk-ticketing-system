
{% extends 'base.html' %}
{% block title %}Login — IT Helpdesk{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">

    <div class="card shadow border-0 mt-4">

      <!-- Login card header -->
      <div class="card-header bg-primary text-white text-center py-3">
        <i class="bi bi-headset fs-2 d-block"></i>
        <h5 class="mb-0 mt-1 fw-bold">IT Helpdesk</h5>
      </div>

      <div class="card-body p-4">

        <!-- Login form -->
        <form method="POST" action="{{ url_for('login') }}">

          <!-- CSRF security protection -->
          <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
          >

          <!-- Username field -->
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold">
              Username
            </label>

            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-person"></i>
              </span>

              <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                placeholder="Your username"
                autocomplete="username"
                required
                autofocus
              >
            </div>
          </div>

          <!-- Password field -->
          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">
              Password
            </label>

            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-lock"></i>
              </span>

              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Your password"
                autocomplete="current-password"
                required
              >
            </div>
          </div>

          <!-- Sign In button -->
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right me-1"></i>
            Sign In
          </button>

        </form>

      </div>

      <!-- Login card footer -->
      <div class="card-footer text-muted text-center small">
        Secure IT Helpdesk Access
        <div>
          Sign in using your configured account.
        </div>
      </div>

    </div>

  </div>
</div>
{% endblock %}
